[project]
name = "spm-slang"
version = "0.1.0"
authors = [{ name = "Fangjun Zhou", email = "fangjun.zhou02@gmail.com" }]
description = "Slang package manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["slangpy>=0.40.1"]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/fangjunzhou/spm"
Issues = "https://github.com/fangjunzhou/spm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["black>=26.3.1", "build>=1.4.3", "twine>=6.2.0"]
